<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#863bff" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="favText" x1="0" y1="15" x2="64" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="favSignal" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#favBg)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" />
  <rect x="2" y="2" width="60" height="60" rx="18" fill="#000000" fill-opacity="0.15" />

  <!-- Top Morse Signal Track -->
  <circle cx="14" cy="12" r="2.5" fill="#38bdf8" filter="url(#favGlow)" />
  <rect x="22" y="10.5" width="10" height="3" rx="1.5" fill="#ffffff" filter="url(#favGlow)" />
  <circle cx="38" cy="12" r="2.5" fill="#a855f7" filter="url(#favGlow)" />
  <rect x="45" y="10.5" width="8" height="3" rx="1.5" fill="#38bdf8" filter="url(#favGlow)" />

  <!-- Centered MCT Monogram -->
  <text x="32" y="41" text-anchor="middle" fill="url(#favText)" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" letter-spacing="-1px" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))">MCT</text>

  <!-- Bottom Morse Signal Track -->
  <rect x="12" y="50" width="12" height="3.2" rx="1.6" fill="url(#favSignal)" filter="url(#favGlow)" />
  <circle cx="32" cy="51.6" r="2.5" fill="#ffffff" filter="url(#favGlow)" />
  <rect x="40" y="50" width="12" height="3.2" rx="1.6" fill="url(#favSignal)" filter="url(#favGlow)" />
</svg>